<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#140f0b">
  <title>Sem conexão · Pote Político</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: radial-gradient(600px 400px at 50% 20%, #2a1f14, #140f0b); color: #f4ecd8;
           font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; }
    img { width: 140px; height: 140px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,.5); }
    h1 { font: 800 1.8rem/1.2 Georgia, serif; margin: 22px 0 8px; }
    p { color: #cfc8b0; max-width: 340px; margin: 0 auto 22px; }
    button { font: 700 1rem system-ui, sans-serif; padding: .8em 1.6em; border: 0; border-radius: 99px; background: #e7c54d; color: #231a00; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="assets/img/logo-vs.png" alt="Pote Político">
    <h1>Você está sem conexão</h1>
    <p>O pote continua aqui. Assim que a internet voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
